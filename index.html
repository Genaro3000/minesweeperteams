<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campo Minado: Rojo vs Azul</title>
<style>
  body {
    margin: 0;
    background: #393d42;
    color: #e6edf3;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 12px 48px;
  }
  h1 { text-align: center; }
  #join { text-align: center; max-width: 400px; }
  #join input {
    padding: 10px; width: 100%; box-sizing: border-box; margin: 10px 0;
    border-radius: 6px; border: 1px solid #223040; background: var(--bg-deep); color: #fff;
  }
 #join button, #adminBtn, #playAgainBtn, #flagModeBtn {
    padding: 10px 16px; border-radius: 6px; border: none;
    background: #ffd166; font-weight: bold; cursor: pointer;
  }
  #teamLabel { font-weight: bold; margin-bottom: 12px; }
  #teamLabel.red { color: #ff4655; }
  #teamLabel.blue { color: #3da5ff; }
  #scoreboard { margin-bottom: 12px; font-weight: bold; }
  #board {
    display: grid;
    gap: 2px;
    background: #223040;
    border: 1px solid #223040;
    width: max-content;
  }
  .cell {
    width: 26px; height: 26px;
    background: #131a22; color: #fff;
    border: none; font-weight: bold; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .cell:disabled { cursor: default; }
  .cell.red { background: var(--bg-deep); box-shadow: inset 0 0 0 2px #FF0000; }
  .cell.blue { background: var(--bg-deep); box-shadow: inset 0 0 0 2px #2a9df5; }
  .cell.flagged { background: #4a4030; }
  #flagModeBtn { width: auto; padding: 8px 14px; font-size: 13px; margin-bottom: 12px; }
  #adminPanel { margin-bottom: 16px; display: none; }
  #result { font-size: 22px; font-weight: bold; color: #ffd166; margin-top: 12px; }
</style>
</head>
<body>

<h1>💣 MINESWEEPER: RED vs BLUE</h1>

<!-- Pantalla para unirse -->
<div id="join">
  <p>You'll get a random team. Safe tile = +1 point. Mine = -1 point.</p>
  <input id="nameInput" placeholder="Your Discord name" maxlength="24" />
  <button onclick="joinGame()">JOIN GAME</button>
</div>

<!-- Juego (oculto hasta que te unís) -->
<div id="game" style="display:none">
  <div id="teamLabel"></div>

  <div id="adminPanel">
    <b>Host Panel</b>
    <p style="margin:8px 0;">Resets the global scoreboard back to 0 for everyone.</p>
    <button id="adminBtn" onclick="resetGlobalScore()">Reset Global Scoreboard</button>
  </div>

  <div id="scoreboard">
    <span class="r">Red: <span id="redScore">0</span></span>
    <span class="b">Blue: <span id="blueScore">0</span></span>
  </div>

  <div id="roundIntro">
    <p id="roundIntroText">Ready for your round? Clear as many safe tiles as you can — hit a mine and it's over.</p>
    <button id="playAgainBtn" onclick="startRound()">START ROUND</button>
  </div>

  <div id="roundArea" style="display:none">
        <div id="personalScore">Your score this round: <span id="roundScoreVal">0</span></div>
    <button id="flagModeBtn" onclick="toggleFlagMode()">🚩 Switch to Flag</button>
    <div id="boardWrap"><div id="board"></div></div>
  </div>

  <div id="result"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCM6PDC1-IVSJVhj8d68uCLF8hedb8IyB8",
    authDomain: "minesweeper-redvsblue.firebaseapp.com",
    databaseURL: "https://minesweeper-redvsblue-default-rtdb.firebaseio.com",
    projectId: "minesweeper-redvsblue",
    storageBucket: "minesweeper-redvsblue.firebasestorage.app",
    messagingSenderId: "173545402444",
    appId: "1:173545402444:web:fce9ed6048878e08fb84e9"
  };

  const ADMIN_CODE = "1234";

  // 👇 Cambia estos tres números para ajustar la dificultad de cada ronda
  const ROWS = 12;
  const COLS = 14;
  const MINES = 22;

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const teamScoreRef = ref(db, "teamScores/current");

  let myTeam = localStorage.getItem("ms_team");

  const params = new URLSearchParams(location.search);
  if (params.get("admin") === ADMIN_CODE) {
    document.getElementById("adminPanel").style.display = "block";
  }

  window.joinGame = function () {
    const name = document.getElementById("nameInput").value.trim();
    if (name) localStorage.setItem("ms_name", name);
    if (!myTeam) {
      myTeam = Math.random() < 0.5 ? "red" : "blue";
      localStorage.setItem("ms_team", myTeam);
    }
    document.getElementById("join").style.display = "none";
    document.getElementById("game").style.display = "flex";
    const label = document.getElementById("teamLabel");
    label.textContent = "You're on team " + (myTeam === "red" ? "RED" : "BLUE");
    label.className = myTeam;
  };

  if (localStorage.getItem("ms_name")) {
    joinGame();
  }

  window.resetGlobalScore = function () {
    set(teamScoreRef, { red: 0, blue: 0 });
  };

  onValue(teamScoreRef, (snap) => {
    const scores = snap.val() || { red: 0, blue: 0 };
    document.getElementById("redScore").textContent = scores.red;
    document.getElementById("blueScore").textContent = scores.blue;
  });

  // --- Ronda individual: solo el puntaje final se sincroniza con Firebase ---
  let cells = [];
  let roundActive = false;
  let roundScore = 0;

  function generateBoard() {
    const size = ROWS * COLS;
    const board = Array.from({ length: size }, () => ({ mine: false, adjacent: 0, revealed: false, flagged: false }));
    let placed = 0;
    while (placed < MINES) {
      const idx = Math.floor(Math.random() * size);
      if (!board[idx].mine) { board[idx].mine = true; placed++; }
    }
    const at = (r, c) => r * COLS + c;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (board[at(r, c)].mine) continue;
      let n = 0;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && board[at(rr, cc)].mine) n++;
      }
      board[at(r, c)].adjacent = n;
    }
    return board;
  }

  function floodFill(startRow, startCol) {
    const at = (r, c) => r * COLS + c;
    const toReveal = new Set();
    const stack = [[startRow, startCol]];
    while (stack.length) {
      const [r, c] = stack.pop();
      const idx = at(r, c);
      if (toReveal.has(idx) || cells[idx].revealed) continue;
      toReveal.add(idx);
      if (cells[idx].adjacent === 0 && !cells[idx].mine) {
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          const rr = r + dr, cc = c + dc;
          if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {
            const nIdx = at(rr, cc);
            if (!cells[nIdx].revealed && !toReveal.has(nIdx)) stack.push([rr, cc]);
          }
        }
      }
    }
    return toReveal;
  }

    let flagMode = false;
  window.toggleFlagMode = function () {
    flagMode = !flagMode;
    document.getElementById("flagModeBtn").textContent = flagMode ? "⛏️ Switch to Dig" : "🚩 Switch to Flag";
  };

  window.cellClick = function (row, col) {
    if (flagMode) toggleFlag(row, col);
    else revealCell(row, col);
  };

  function toggleFlag(row, col) {
    const idx = row * COLS + col;
    if (!roundActive || cells[idx].revealed) return;
    cells[idx].flagged = !cells[idx].flagged;
    renderBoard();
  }

  window.startRound = function () {
    cells = generateBoard();
    roundActive = true;
    roundScore = 0;
    document.getElementById("roundIntro").style.display = "none";
    document.getElementById("roundArea").style.display = "block";
    document.getElementById("result").textContent = "";
    document.getElementById("roundScoreVal").textContent = "0";
    renderBoard();
  };

  window.revealCell = function (row, col) {
    if (!roundActive) return;
    const idx = row * COLS + col;
    if (cells[idx].revealed || cells[idx].flagged) return;

    const toReveal = floodFill(row, col);
    let hitMine = false;
    toReveal.forEach((i) => {
      cells[i].revealed = true;
      if (cells[i].mine) hitMine = true;
      else roundScore++;
    });

    document.getElementById("roundScoreVal").textContent = roundScore;
    renderBoard();

    if (hitMine) { endRound(false); return; }
    const remainingSafe = cells.filter(c => !c.mine && !c.revealed).length;
    if (remainingSafe === 0) endRound(true);
  };

  function endRound(won) {
    roundActive = false;
    const finalScore = won ? roundScore + 10 : roundScore;

    runTransaction(teamScoreRef, (current) => {
      const scores = current || { red: 0, blue: 0 };
      scores[myTeam] = (scores[myTeam] || 0) + finalScore;
      return scores;
    });

    const result = document.getElementById("result");
    result.textContent = won
      ? `YOU CLEARED THE BOARD! +${finalScore} points for team ${myTeam.toUpperCase()}`
      : `BOOM! You scored ${finalScore} points for team ${myTeam.toUpperCase()} before hitting a mine.`;

    document.getElementById("roundIntroText").textContent = "Ready for another round?";
    document.getElementById("roundIntro").style.display = "block";
    document.getElementById("roundArea").style.display = "none";
  }

  function renderBoard() {
    const board = document.getElementById("board");
    board.style.gridTemplateColumns = `repeat(${COLS}, 28px)`;
    board.innerHTML = "";
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = cells[r * COLS + c];
        const btn = document.createElement("button");
        btn.className = "cell" + (cell.revealed ? " " + myTeam : "") + (cell.flagged ? " flagged" : "");
        btn.disabled = cell.revealed || !roundActive;
        if (cell.revealed) btn.textContent = cell.mine ? "💥" : (cell.adjacent || "");
        else if (cell.flagged) btn.textContent = "🚩";
        btn.onclick = () => cellClick(r, c);
        btn.oncontextmenu = (e) => { e.preventDefault(); toggleFlag(r, c); };
        board.appendChild(btn);
      }
    }
  }
</script>
</body>
</html>
